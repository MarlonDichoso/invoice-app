<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Generator</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial;margin:15px;max-width:1000px}
input{padding:8px;width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:8px}
button{padding:10px;margin:5px}
</style>
</head>
<body>
<h1>Invoice Generator</h1>

<input id="company" placeholder="Company Name" value="Invoice Generator"><br><br>
<input id="customer" placeholder="Customer Name"><br><br>
<input id="invoiceNo" placeholder="Invoice Number" value="INV-001"><br><br>

<table id="tbl">
<tr><th>Description</th><th>Qty</th><th>Rate</th><th>Total</th></tr>
</table>

<button onclick="addRow()">Add Item</button>
<button onclick="downloadPDF()">Download PDF</button>

<h2>Total: $<span id="grand">0.00</span></h2>

<script>
function addRow(){
 let r=document.createElement('tr');
 r.innerHTML=`
 <td><input></td>
 <td><input type="number" value="1" onchange="calc()"></td>
 <td><input type="number" value="0" onchange="calc()"></td>
 <td class="t">0.00</td>`;
 document.getElementById('tbl').appendChild(r);
 calc();
}

function calc(){
 let g=0;
 document.querySelectorAll('#tbl tr').forEach((r,i)=>{
  if(i===0) return;
  let q=parseFloat(r.cells[1].children[0].value)||0;
  let rate=parseFloat(r.cells[2].children[0].value)||0;
  let t=q*rate;
  r.cells[3].innerText=t.toFixed(2);
  g+=t;
 });
 document.getElementById('grand').innerText=g.toFixed(2);
}

async function downloadPDF(){
 const { jsPDF } = window.jspdf;
 const pdf = new jsPDF();

 pdf.setFontSize(18);
 pdf.text(document.getElementById('company').value,20,20);

 pdf.setFontSize(12);
 pdf.text("Invoice #: "+document.getElementById('invoiceNo').value,20,35);
 pdf.text("Customer: "+document.getElementById('customer').value,20,45);

 let y=60;
 pdf.text("Description",20,y);
 pdf.text("Qty",100,y);
 pdf.text("Rate",130,y);
 pdf.text("Total",170,y);

 document.querySelectorAll('#tbl tr').forEach((r,i)=>{
   if(i===0) return;
   y+=10;
   pdf.text((r.cells[0].children[0].value||""),20,y);
   pdf.text(r.cells[1].children[0].value,100,y);
   pdf.text(r.cells[2].children[0].value,130,y);
   pdf.text(r.cells[3].innerText,170,y);
 });

 y+=20;
 pdf.text("Grand Total: $"+document.getElementById('grand').innerText,20,y);

 pdf.save("invoice.pdf");
}

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}

addRow();
</script>
</body>
</html>
